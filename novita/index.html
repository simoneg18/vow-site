<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le novità di VOW per email</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2EDE4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<!--
  «Non scrivermi più» (2026-10-27, ROADMAP CT, tavola D2 sulla tela "Consenso
  alle email"). Il link in fondo a ogni email delle novità porta qui con il
  codice personale: https://vowhabits.com/novita/?c=CODICE. Un clic, senza
  entrare: la pagina chiama smetti_novita (migration 0102, con la chiave
  pubblica dell'app) e conferma. Niente «sei sicuro?», niente motivi da
  scegliere. Le email con il codice per entrare in VOW non c'entrano.
  La fonte e' landing/novita/ nel repo dell'app; vow-site si aggiorna copiando.
-->
<style>
  :root {
    --paper: #F2EDE4;
    --card: #FFFFFF;
    --ink: #1A1612;
    --ink-soft: #5C5248;
    --ink-ghost: #9A9088;
    --sand: #D4C9B8;
    --hair: rgba(26, 22, 18, 0.08);
    --mark: #C13B2A;
    --display: 'Bebas Neue', Impact, sans-serif;
    --sans: 'DM Sans', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  main { max-width: 460px; margin: 0 auto; padding: 40px 24px 48px; display: flex; flex-direction: column; gap: 16px; min-height: 100vh; }
  .logo { display: block; width: 140px; height: auto; align-self: center; margin-bottom: 12px; }
  .occhiello { font-size: 11px; font-weight: 600; letter-spacing: 1.6px; color: var(--mark); text-transform: uppercase; }
  h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 44px; letter-spacing: 0.3px; }
  p { margin: 0; font-size: 15px; line-height: 21px; color: var(--ink-soft); }
  .riquadro { background: var(--card); border: 1px solid var(--hair); border-radius: 16px; padding: 14px 16px; font-size: 14px; line-height: 19px; color: var(--ink-soft); }
  button { min-height: 54px; border-radius: 14px; border: none; background: var(--mark); color: #fff; font-family: var(--sans); font-weight: 700; font-size: 15px; letter-spacing: 0.3px; padding: 0 16px; cursor: pointer; }
  [hidden] { display: none !important; }
  footer { margin-top: auto; padding-top: 24px; font-size: 12px; color: var(--ink-ghost); text-align: center; }
  footer a { color: var(--ink-ghost); }
</style>
</head>
<body>
<main>
  <img class="logo" src="/i/vow.png" width="140" height="66" alt="VOW">
  <div class="occhiello" id="occhiello">Le novità per email</div>
  <h1 id="titolo">Un attimo…</h1>
  <p id="testo"></p>
  <div class="riquadro" id="riquadro" hidden></div>
  <button id="riprova" type="button" hidden>Riprova</button>
  <footer><a href="https://vowhabits.com/">vowhabits.com</a> · <a href="https://vowhabits.com/privacy/" id="privacy">Privacy</a></footer>
</main>
<script>
(function () {
  var SUPABASE_URL = 'https://yyizrphpabhlbejapesl.supabase.co';
  var ANON = 'sb_publishable_fFlIVDOrFGLbipp_dnWYqw_redgXdOZ';
  var it = (navigator.language || 'it').toLowerCase().indexOf('it') === 0;
  var $ = function (id) { return document.getElementById(id); };
  var t = function (a, b) { return it ? a : b; };
  document.documentElement.lang = it ? 'it' : 'en';
  if (!it) {
    document.title = 'VOW news by email';
    $('occhiello').textContent = 'News by email';
    $('titolo').textContent = 'One moment…';
    $('riprova').textContent = 'Try again';
    $('privacy').textContent = 'Privacy';
  }

  function mostra(titolo, testo, riquadro, riprova) {
    $('titolo').textContent = titolo;
    $('testo').textContent = testo;
    $('riquadro').textContent = riquadro || '';
    $('riquadro').hidden = !riquadro;
    $('riprova').hidden = !riprova;
  }

  var CAMBI_IDEA = t('Se cambi idea: nell’app, Impostazioni, Le novità per email.', 'If you change your mind: in the app, Settings, News by email.');
  function fatto() {
    mostra(
      t('Fatto. Non ti scriviamo più le novità.', 'Done. We won’t write to you about what’s new any more.'),
      t('Da adesso a questo indirizzo arrivano solo le email con il codice per entrare in VOW. Le novità le trovi nell’app, nella lettera di ogni versione.', 'From now on this address only gets the emails with the code to sign in to VOW. You’ll find the news in the app, in the letter of each version.'),
      CAMBI_IDEA
    );
  }
  function nonValido() {
    mostra(
      t('Questo link non funziona.', 'This link doesn’t work.'),
      t('Per non ricevere più le novità: nell’app, Impostazioni, Le novità per email, e spegni. Oppure scrivici a privacy@vowhabits.com.', 'To stop getting the news: in the app, Settings, News by email, and turn it off. Or write to us at privacy@vowhabits.com.')
    );
  }

  var m = /[?&]c=([0-9a-fA-F]{32})(?![0-9a-fA-F])/.exec(location.search);
  var codice = m ? m[1].toLowerCase() : null;
  if (!codice) { nonValido(); return; }

  function smetti() {
    mostra(t('Un attimo…', 'One moment…'), '');
    fetch(SUPABASE_URL + '/rest/v1/rpc/smetti_novita', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: ANON },
      body: JSON.stringify({ p_codice: codice })
    })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then(function (esito) {
        // 'fatto' o 'gia': per chi legge è lo stesso, non riceve più le novità.
        if (esito === 'fatto' || esito === 'gia') fatto();
        else nonValido();
      })
      .catch(function () {
        mostra(
          t('Non è partito.', 'It didn’t go through.'),
          t('Controlla la connessione e riprova.', 'Check your connection and try again.'),
          null,
          true
        );
      });
  }
  $('riprova').addEventListener('click', smetti);
  smetti();
})();
</script>
</body>
</html>
